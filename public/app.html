<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#166534"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/icono.svg"><link rel="apple-touch-icon" href="/img/icono.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Canchas Control · Panel</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div id="vistaLogin" class="login tarjeta oculto">
  <h2>⚽ Canchas Control</h2>
  <p class="suave">Ingreso de empleados</p>
  <form id="formLogin">
    <label for="lEmail">Email</label><input id="lEmail" type="email" required autocomplete="username">
    <label for="lPass" style="margin-top:10px">Contraseña</label><input id="lPass" type="password" required autocomplete="current-password">
    <div id="lMsg"></div>
    <button style="margin-top:12px;width:100%">Ingresar</button>
  </form>
</div>

<div id="vistaApp" class="oculto">
  <header class="cabecera"><div class="contenedor">
    <h1>⚽<span class="solo-escritorio"> Canchas Control</span></h1>
    <select id="selSede" aria-label="Sede"></select>
    <span class="espacio"></span>
    <span id="usuarioInfo" class="solo-escritorio"></span>
    <button class="sec chico solo-escritorio" id="btnPass">Contraseña</button>
    <button class="sec chico solo-escritorio" id="btnSalir">Salir</button>
  </div></header>
  <nav class="tabs" id="tabs">
    <button data-v="inicio"><span class="barra-tabs-ic">🏠</span>Inicio</button>
    <button data-v="reservas"><span class="barra-tabs-ic">📅</span>Reservas</button>
    <button data-v="ventas"><span class="barra-tabs-ic">🛒</span>Ventas</button>
    <button data-v="inventario"><span class="barra-tabs-ic">📦</span>Inventario</button>
    <button data-v="catalogo" class="solo-admin solo-escritorio">Productos</button>
    <button data-v="config" class="solo-admin solo-escritorio">Sedes y usuarios</button>
    <button data-v="bi" class="solo-admin solo-escritorio">Reportes / BI</button>
    <button data-mas="1" class="solo-movil"><span class="barra-tabs-ic">☰</span>Más</button>
  </nav>
  <main class="contenedor" id="vista"></main>
</div>

<div class="modal-fondo oculto" id="modal"><div class="modal" id="modalCuerpo"></div></div>

<script src="/js/comun.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
