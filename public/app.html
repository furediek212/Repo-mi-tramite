<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canchas Control · Panel</title>
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div id="vistaLogin" class="login tarjeta oculto">
  <h2>⚽ Canchas Control</h2>
  <p class="suave">Ingreso de empleados</p>
  <form id="formLogin">
    <label for="lEmail">Email</label><input id="lEmail" type="email" required autocomplete="username">
    <label for="lPass" style="margin-top:10px">Contraseña</label><input id="lPass" type="password" required autocomplete="current-password">
    <div id="lMsg"></div>
    <button style="margin-top:12px;width:100%">Ingresar</button>
  </form>
</div>

<div id="vistaApp" class="oculto">
  <header class="cabecera"><div class="contenedor">
    <h1>⚽ Canchas Control</h1>
    <select id="selSede" aria-label="Sede"></select>
    <span class="espacio"></span>
    <span id="usuarioInfo"></span>
    <button class="sec chico" id="btnPass">Contraseña</button>
    <button class="sec chico" id="btnSalir">Salir</button>
  </div></header>
  <nav class="tabs" id="tabs">
    <button data-v="inicio">Inicio</button>
    <button data-v="reservas">Reservas</button>
    <button data-v="ventas">Ventas</button>
    <button data-v="inventario">Inventario</button>
    <button data-v="catalogo" class="solo-admin">Productos</button>
    <button data-v="config" class="solo-admin">Sedes y usuarios</button>
    <button data-v="bi" class="solo-admin">Reportes / BI</button>
  </nav>
  <main class="contenedor" id="vista"></main>
</div>

<div class="modal-fondo oculto" id="modal"><div class="modal" id="modalCuerpo"></div></div>

<script src="/js/comun.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
